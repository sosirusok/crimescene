name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static multi-page site
        run: PAGES_BASE=/crimescene node pages-src/build.mjs
      - name: Smoke-check generated customer site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/site.css
          test -s _site/assets/site.js
          test -s _site/assets/public-v3.js
          node --check _site/assets/site.js
          node --check _site/assets/public-v3.js
          node scripts/smoke-render.cjs
          grep -q 'assets/site.js?v=20260816-12' _site/index.html
          grep -q 'assets/public-v3.js?v=20260816-12' _site/index.html
          grep -q 'app.innerHTML=html' _site/assets/site.js
          grep -q 'function patchReservationBoard' _site/assets/public-v3.js
          grep -q '페이지를 불러오지 못했습니다' _site/index.html
          test -s _site/reservations/index.html
          test -s _site/reservations/new/index.html
          test -s _site/reservations/lookup/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live customer deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ready=0
          for attempt in $(seq 1 20); do
            if curl --retry 2 --retry-all-errors -fsSL "${base}?sha=${GITHUB_SHA}" -o /tmp/home.html; then
              if grep -q 'assets/site.js?v=20260816-12' /tmp/home.html && grep -q 'assets/public-v3.js?v=20260816-12' /tmp/home.html; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = "1"
          curl --retry 4 --retry-all-errors -fsSL "${base}assets/site.js?v=20260816-12" -o /tmp/site.js
          curl --retry 4 --retry-all-errors -fsSL "${base}assets/public-v3.js?v=20260816-12" -o /tmp/public-v3.js
          curl --retry 4 --retry-all-errors -fsSL "${base}reservations/?sha=${GITHUB_SHA}" -o /tmp/reservations.html
          node --check /tmp/site.js
          node --check /tmp/public-v3.js
          grep -q 'data-route="home"' /tmp/home.html
          grep -q 'data-route="reservations"' /tmp/reservations.html
          echo "Live GitHub Pages deployment verified: ${base}"
