name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages-src/customer-final.js'
      - 'pages-src/final.css'
      - 'pages-src/shell.html'
      - 'pages-src/build.mjs'
      - 'scripts/smoke-customer.cjs'
      - 'public/images/**'
      - 'public/favicon.svg'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: customer-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build customer site
        run: PAGES_BASE=/crimescene node pages-src/build.mjs
      - name: Verify generated customer site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/final.css
          test -s _site/assets/customer-final.js
          node --check _site/assets/customer-final.js
          node scripts/smoke-customer.cjs
          grep -q 'customer-final.js?v=20260816-30' _site/index.html
          grep -q 'final.css?v=20260816-30' _site/index.html
          grep -q 'data-route="home"' _site/index.html
          grep -q 'data-route="reservations"' _site/reservations/index.html
          grep -q 'data-route="reservation-new"' _site/reservations/new/index.html
          grep -q 'data-route="reservation-lookup"' _site/reservations/lookup/index.html
          ! grep -Eq 'Supabase|OWNER|Reservation form|AES-GCM|서비스 역할' _site/assets/customer-final.js
      - name: Verify reservation API
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"4.0.0"'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/bootstrap" > /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/bootstrap.json',encoding='utf-8'))
          assert data['settings']['bookingWindowDays'] == 15
          assert data['settings']['paymentMode'] in ('ONSITE','ONLINE')
          capacities={t['id']:t['totalCapacity'] for t in data['themes']}
          assert capacities == {'A':8,'B':9,'C':9,'D':8}, capacities
          assert all(t['minPlayers']==4 for t in data['themes'])
          print('API bootstrap verified', capacities)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live customer site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --retry 2 --retry-all-errors -fsSL "${base}?sha=${GITHUB_SHA}" -o /tmp/home.html; then
              if grep -q 'customer-final.js?v=20260816-30' /tmp/home.html; then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = "1"
          curl --retry 4 --retry-all-errors -fsSL "${base}assets/customer-final.js?v=20260816-30" -o /tmp/customer-final.js
          curl --retry 4 --retry-all-errors -fsSL "${base}assets/final.css?v=20260816-30" -o /tmp/final.css
          curl --retry 4 --retry-all-errors -fsSL "${base}reservations/?sha=${GITHUB_SHA}" -o /tmp/reservations.html
          node --check /tmp/customer-final.js
          test -s /tmp/final.css
          grep -q 'data-route="home"' /tmp/home.html
          grep -q 'data-route="reservations"' /tmp/reservations.html
          echo "Live customer site verified: ${base}"
