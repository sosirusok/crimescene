name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages-src/customer-final.js'
      - 'pages-src/customer-polish.css'
      - 'pages-src/final.css'
      - 'pages-src/shell.html'
      - 'pages-src/build.mjs'
      - 'scripts/smoke-customer.cjs'
      - 'scripts/smoke-nicepay.cjs'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'public/images/**'
      - 'public/favicon.svg'
      - 'public/fonts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: customer-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build customer site
        run: node pages-src/build.mjs

      - name: Verify generated customer site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/themes/index.html
          test -s _site/reservations/index.html
          test -s _site/reservations/new/index.html
          test -s _site/assets/final.css
          test -s _site/assets/customer-final.js
          test -s _site/assets/customer-polish.css
          test -s _site/fonts/Pretendard-Regular.woff2
          test -s _site/fonts/Pretendard-ExtraBold.woff2

          node --check _site/assets/customer-final.js
          node scripts/smoke-customer.cjs
          node scripts/smoke-nicepay.cjs

          grep -q 'customer-final.js?v=' _site/index.html
          grep -q 'final.css?v=' _site/index.html
          grep -q 'customer-polish.css?v=' _site/index.html
          grep -q 'Pretendard-Regular.woff2' _site/assets/customer-polish.css
          grep -q 'data-route="home"' _site/index.html
          grep -q 'data-route="reservations"' _site/reservations/index.html
          grep -q 'data-route="reservation-new"' _site/reservations/new/index.html
          grep -q 'data-route="reservation-lookup"' _site/reservations/lookup/index.html

          grep -q 'functions/v1/customer-api' _site/assets/customer-final.js
          grep -q '(주)싱글' _site/assets/customer-final.js
          grep -q '정지훈' _site/assets/customer-final.js
          grep -q '744-88-01446' _site/assets/customer-final.js
          grep -q 'jjhun65@hanmail.net' _site/assets/customer-final.js
          grep -q 'menu-lines' _site/assets/customer-final.js
          grep -q 'aria-controls="mobile-drawer"' _site/assets/customer-final.js
          grep -q 'document.addEventListener("pointerup"' _site/assets/customer-final.js
          grep -q 'open-room-introductions' _site/assets/customer-final.js
          grep -q '예약 시간표의 해당 오픈룸과 합류 화면에 표시됩니다' _site/assets/customer-final.js
          grep -q 'RESERVATION MOBILE WIDTH FIX 2026-08-19' _site/assets/final.css
          grep -q 'OWNER FEEDBACK FINAL 2026-08-19' _site/assets/final.css

          ! grep -q '난이도</dt>' _site/assets/customer-final.js
          ! grep -q 'theme.difficulty' _site/assets/customer-final.js
          ! grep -Eq 'Supabase|OWNER|Reservation form|AES-GCM|서비스 역할' _site/assets/customer-final.js

      - name: Verify customer API and Korean domain CORS
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/customer-api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          origin='https://xn--oi2bkkl05a1gchcr33e50h.com'

          curl --retry 4 --retry-all-errors -fsSL -D /tmp/health-headers \
            -H "apikey: ${key}" -H "Origin: ${origin}" \
            "${api}/health" -o /tmp/health.json
          grep -qi "access-control-allow-origin: ${origin}" /tmp/health-headers
          grep -q '"version":"5.0.0"' /tmp/health.json
          grep -q '"paymentProvider":"NICEPAY"' /tmp/health.json

          curl --retry 4 --retry-all-errors -fsSL \
            -H "apikey: ${key}" -H "Origin: ${origin}" \
            "${api}/bootstrap" > /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/bootstrap.json',encoding='utf-8'))
          settings=data['settings']
          assert isinstance(settings.get('bookingWindowDays'), int)
          assert settings['bookingWindowDays'] == 15, settings
          assert settings.get('paymentMode') in {'ONSITE','ONLINE'}
          for field in ('storeName','branchName','phone','addressRoad'):
              assert isinstance(settings.get(field), str) and settings[field].strip(), (field, settings)
          payment=data.get('payment') or {}
          assert payment.get('provider') == 'NICEPAY', payment
          assert isinstance(payment.get('onlineEnabled'), bool)
          assert isinstance(payment.get('integrationReady'), bool)
          themes=data.get('themes') or []
          assert themes
          assert all(str(t.get('id') or '').strip() for t in themes)
          assert all(isinstance(t.get('times'), list) for t in themes)
          assert all(1 <= int(t.get('minPlayers') or 0) <= int(t.get('totalCapacity') or 0) for t in themes)
          assert all(not str(t.get('difficulty') or '').strip() for t in themes)
          print('Customer bootstrap verified', settings['bookingWindowDays'], 'days', len(themes), 'themes')
          PY

          play_date=$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat())
          PY
          )
          curl --retry 4 --retry-all-errors -fsSL \
            -H "apikey: ${key}" -H "Origin: ${origin}" \
            "${api}/availability?date=${play_date}" > /tmp/availability.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/availability.json',encoding='utf-8'))
          slots=[slot for theme in data.get('themes',[]) for slot in theme.get('times',[])]
          assert slots
          assert all(isinstance(slot.get('openRoomIntroductions'), list) for slot in slots)
          print('Open-room introductions verified for', len(slots), 'slots')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live customer site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --retry 2 --retry-all-errors -fsSL "${base}?sha=${GITHUB_SHA}" -o /tmp/home.html; then
              if grep -q 'customer-final.js?v=' /tmp/home.html; then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = '1'

          script_path=$(grep -oE 'assets/customer-final\.js\?v=[^" ]+' /tmp/home.html | head -1)
          style_path=$(grep -oE 'assets/final\.css\?v=[^" ]+' /tmp/home.html | head -1)
          polish_path=$(grep -oE 'assets/customer-polish\.css\?v=[^" ]+' /tmp/home.html | head -1)
          test -n "$script_path"
          test -n "$style_path"
          test -n "$polish_path"

          curl --retry 4 --retry-all-errors -fsSL "${base}${script_path}" -o /tmp/customer-final.js
          curl --retry 4 --retry-all-errors -fsSL "${base}${style_path}" -o /tmp/final.css
          curl --retry 4 --retry-all-errors -fsSL "${base}${polish_path}" -o /tmp/customer-polish.css
          curl --retry 4 --retry-all-errors -fsSL "${base}fonts/Pretendard-Regular.woff2" -o /tmp/Pretendard-Regular.woff2
          curl --retry 4 --retry-all-errors -fsSL "${base}reservations/?sha=${GITHUB_SHA}" -o /tmp/reservations.html

          node --check /tmp/customer-final.js
          test -s /tmp/final.css
          test -s /tmp/customer-polish.css
          test -s /tmp/Pretendard-Regular.woff2
          grep -q 'Pretendard-Regular.woff2' /tmp/customer-polish.css
          grep -q '(주)싱글' /tmp/customer-final.js
          grep -q '744-88-01446' /tmp/customer-final.js
          grep -q 'jjhun65@hanmail.net' /tmp/customer-final.js
          grep -q 'menu-lines' /tmp/customer-final.js
          grep -q 'aria-controls="mobile-drawer"' /tmp/customer-final.js
          grep -q 'document.addEventListener("pointerup"' /tmp/customer-final.js
          grep -q 'open-room-introductions' /tmp/customer-final.js
          grep -q 'RESERVATION MOBILE WIDTH FIX 2026-08-19' /tmp/final.css
          ! grep -q '난이도</dt>' /tmp/customer-final.js
          ! grep -q 'theme.difficulty' /tmp/customer-final.js
          grep -q 'data-route="home"' /tmp/home.html
          grep -q 'data-route="reservations"' /tmp/reservations.html

          custom='https://www.xn--oi2bkkl05a1gchcr33e50h.com/'
          curl --retry 5 --retry-all-errors -fsSL "${custom}?sha=${GITHUB_SHA}" -o /tmp/custom-home.html
          grep -q 'customer-final.js?v=' /tmp/custom-home.html
          echo "Live customer site verified: ${base} and ${custom}"
