name: Apply final customer wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-copy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify customer wording
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-final-copy.cjs
          node --check pages-src/customer-final.js
          grep -q '동의를 거부할 수 있으나 필수 정보라 예약은 진행할 수 없습니다' pages-src/customer-final.js
          grep -q '분쟁 처리 기록은 3년간 보관합니다' pages-src/customer-final.js
          grep -q '대금결제 및 서비스 제공 기록은 5년' pages-src/customer-final.js
          grep -q '이용 예정 금액' pages-src/customer-final.js
          PAGES_BASE=/crimescene node pages-src/build.mjs
          node scripts/smoke-customer.cjs
      - name: Commit verified customer wording
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-final-copy.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-src/customer-final.js scripts/patch-final-copy.cjs
          git commit -m 'fix: finalize consent and amount wording'
          git push origin HEAD:main
