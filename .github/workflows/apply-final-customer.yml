name: Apply final customer platform

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-customer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-customer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified release files
        shell: bash
        run: |
          set -euo pipefail
          cat .final-payload/part* > /tmp/final-customer.b64
          base64 -d /tmp/final-customer.b64 > /tmp/final-customer.tar.xz
          echo '98b301699840054188a29d9a8f7e01955a5be4124d7ad024efd12db932fd0c00  /tmp/final-customer.tar.xz' | sha256sum -c -
          tar -xJf /tmp/final-customer.tar.xz -C .
      - name: Verify the complete customer build
        shell: bash
        run: |
          set -euo pipefail
          node --check pages-src/customer-final.js
          node --check pages-src/build.mjs
          PAGES_BASE=/crimescene node pages-src/build.mjs
          node scripts/smoke-customer.cjs
          test -s _site/index.html
          test -s _site/assets/customer-final.js
          test -s _site/assets/final.css
          ! grep -Eq 'Supabase|OWNER|Reservation form|AES-GCM|서비스 역할' _site/assets/customer-final.js
      - name: Commit final customer platform
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/pages.yml
          rm -rf .final-payload _site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: ship final non-payment customer platform'
          git push origin HEAD:main
