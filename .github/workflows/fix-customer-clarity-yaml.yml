name: Repair customer clarity workflow YAML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-customer-clarity-yaml.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair multiline Python literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-customer-clarity.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          active = False

          for line in lines:
              if not active and (
                  "old_refunds = '''" in line
                  or "new_refunds = '''" in line
                  or "css += r'''" in line
              ):
                  output.append(line)
                  active = True
                  continue

              if active:
                  output.append('          ' + line)
                  if "'''" in line:
                      active = False
                  continue

              output.append(line)

          if active:
              raise SystemExit('multiline literal was not closed')

          repaired = '\n'.join(output) + '\n'
          path.write_text(repaired, encoding='utf-8')

          text = path.read_text(encoding='utf-8')
          if '\n/* CUSTOMER CLARITY NOTICE 2026-08-18 */' in text:
              raise SystemExit('CSS block is still outside the YAML run block')
          if '\n        ["1. 온라인 취소"' in text:
              raise SystemExit('policy block is still outside the YAML run block')
          PY

      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-customer-clarity-yaml.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'ci: repair customer clarity workflow YAML'
          git pull --rebase origin main
          git push origin HEAD:main
