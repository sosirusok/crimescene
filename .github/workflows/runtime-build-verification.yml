# Full build check after all helper mode corrections
name: Runtime build verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-build-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        env:
          SITES_INSTALL_TIMEOUT: 10m
        run: npm run install:ci
      - name: Build and validate runtime artifact
        env:
          SITES_BUILD_TIMEOUT: 5m
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run validate:artifact
          test -s dist/.runtime/runtime-bindings.json
          test -s dist/server/index.js
