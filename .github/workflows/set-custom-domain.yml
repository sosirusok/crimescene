name: Set customer custom domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-custom-domain.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  set-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set GitHub Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          domain='www.xn--oi2bkkl05a1gchcr33e50h.com'
          code=$(curl -sS -o /tmp/pages-update.txt -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "{\"cname\":\"${domain}\",\"build_type\":\"workflow\"}")
          cat /tmp/pages-update.txt
          test "$code" = '204'
          current=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          python3 - "$domain" "$current" <<'PY'
          import json,sys
          expected=sys.argv[1]
          data=json.loads(sys.argv[2])
          assert data.get('cname') == expected, data
          print('custom domain set:', data.get('cname'))
          PY
# trigger
