# Final verification after reservation mobile width fix
name: Verify live customer site on mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-live-verification.yml'
      - 'scripts/verify-live-mobile.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-mobile-live-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run real mobile interaction tests
        env:
          BASE_URL: https://www.xn--oi2bkkl05a1gchcr33e50h.com/
          TEST_DATE: '2026-09-01'
          TEST_INTRO: '20대 두 명입니다. 추리는 처음이지만 즐겁게 참여하겠습니다.'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-mobile.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-mobile-live-verification
          path: verification-output
          if-no-files-found: warn
          retention-days: 30

      - name: Record successful mobile verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp verification-output/mobile-live-result.md verification/mobile-live-result.md
          cp verification-output/mobile-live-result.json verification/mobile-live-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/mobile-live-result.md verification/mobile-live-result.json
          git commit -m 'test: record successful mobile customer-site verification'
          git pull --rebase origin main
          git push origin HEAD:main
