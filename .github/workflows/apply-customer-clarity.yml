name: Apply and verify customer clarity notice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-clarity.yml'

permissions:
  contents: write
  actions: read
  pages: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update the live customer site source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('pages-src/customer-final.js')
          css_path = Path('pages-src/final.css')
          build_path = Path('pages-src/build.mjs')
          shell_path = Path('pages-src/shell.html')
          smoke_path = Path('scripts/smoke-customer.cjs')
          pages_path = Path('.github/workflows/pages.yml')

          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          build = build_path.read_text(encoding='utf-8')
          shell = shell_path.read_text(encoding='utf-8')
          smoke = smoke_path.read_text(encoding='utf-8')
          pages = pages_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          js = replace_once(
              js,
              'return `<a class="skip-link" href="#main-content">본문으로 바로가기</a><header class="site-header"><div class="header-inner">',
              'return `<a class="skip-link" href="#main-content">본문으로 바로가기</a><div class="customer-clarity" role="note" aria-label="필수 이용 안내"><div class="customer-clarity-inner"><strong>크라임씬 카페 안내</strong><span>방탈출카페가 아닙니다. 사건 속 인물이 되어 단서와 진술로 범인을 찾는 추리게임입니다.</span><a href="${path("policies/refunds")}">이용 당일 고객 사유 취소는 환불되지 않습니다.</a></div></div><header class="site-header"><div class="header-inner">',
              'global clarity notice',
          )

          js = replace_once(
              js,
              '<p>${h(state.settings.branchName)} 역할형 추리게임</p><h1>사건 속 인물이 되어<br>직접 범인을 찾습니다.</h1><span>각자 다른 배역과 비밀을 받은 뒤 현장을 조사하고, 서로의 진술을 확인하며 한 편의 사건을 완성합니다.</span>',
              '<p>${h(state.settings.branchName)} 크라임씬 추리게임</p><h1>사건 속 인물이 되어<br>용의자 중 범인을 찾습니다.</h1><span>잠금장치를 풀고 나오는 게임이 아닙니다. 각자 배역과 비밀을 받은 뒤 현장을 조사하고 단서와 진술로 범인을 찾아냅니다.</span>',
              'home hero copy',
          )

          js = replace_once(
              js,
              '</aside></section>\n      <section class="quick-facts">',
              '</aside></section>\n      <section class="crime-scene-definition" aria-labelledby="crime-scene-definition-title"><div><p>크라임씬 카페 안내</p><h2 id="crime-scene-definition-title">용의자 중 진짜 범인을 찾는 추리게임입니다.</h2><span>잠금장치를 풀고 공간에서 나오는 것이 목표가 아닙니다. 각자 사건 속 인물이 되어 현장을 조사하고, 단서와 진술을 바탕으로 범인을 추리합니다.</span></div><aside><strong>예약 전 꼭 확인해 주세요</strong><p>이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다.</p><a href="${path("policies/refunds")}">취소 및 환불 기준 보기 ${iconArrow}</a></aside></section>\n      <section class="quick-facts">',
              'home definition section',
          )

          js = replace_once(
              js,
              '<div class="reservation-guide"><strong>예약 전 확인</strong><p>게임은 최소 4명부터 진행합니다. 1~3명은 오픈룸으로 예약하며, 같은 회차의 다른 팀과 함께 플레이합니다.</p><a href="${path("guide")}">오픈룸 자세히 보기</a></div>',
              '<div class="reservation-guide"><strong>예약 전 확인</strong><div><p>게임은 최소 4명부터 진행합니다. 1~3명은 오픈룸으로 예약하며, 같은 회차의 다른 팀과 함께 플레이합니다.</p><p class="same-day-refund">이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다.</p></div><a href="${path("guide")}">이용 안내 보기</a></div>',
              'reservation page notice',
          )

          js = replace_once(
              js,
              '${pageTitle("예약 정보 입력","예약 내용을 확인해 주세요.","필요한 정보만 입력하면 바로 접수됩니다.","form-title")}',
              '${pageTitle("예약 정보 입력","예약 내용을 확인해 주세요.","게임 방식과 취소 규정을 확인한 뒤 예약자 정보를 입력해 주세요.","form-title")}',
              'reservation form title',
          )

          js = replace_once(
              js,
              '<div class="payment-guide" id="payment-guide"></div><div class="consents">',
              '<div class="booking-critical-notice"><strong>예약 전 반드시 확인해 주세요</strong><p>사건 속 인물을 맡아 단서와 진술로 범인을 찾는 크라임씬 추리게임입니다. 이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다.</p></div><div class="payment-guide" id="payment-guide"></div><div class="consents">',
              'booking form critical notice',
          )

          js = replace_once(
              js,
              '<strong>[필수] 예약 취소 안내 확인</strong><p>이용 ${state.settings.cancellationCutoffHours}시간 전까지 온라인 취소가 가능하며, 이후에는 매장으로 문의해야 합니다.</p>',
              '<strong>[필수] 당일 취소 및 환불 안내 확인</strong><p>이용 ${state.settings.cancellationCutoffHours}시간 전까지 온라인 취소가 가능합니다. 이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다.</p>',
              'booking consent',
          )

          js = replace_once(
              js,
              '</article><p class="arrival-note">배역 안내를 위해 시작 ${state.settings.arrivalMinutes}분 전까지 도착해 주세요.</p>',
              '</article><article class="complete-refund-notice"><strong>당일 취소 안내</strong><p>이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다. 예약한 날짜와 시작 시간을 다시 확인해 주세요.</p></article><p class="arrival-note">배역 안내를 위해 시작 ${state.settings.arrivalMinutes}분 전까지 도착해 주세요.</p>',
              'completion page notice',
          )

          js = replace_once(
              js,
              '<span>예약할 때 사용한 이름과 휴대폰 번호만 입력하면 예약 상태, 오픈룸 현황과 취소 가능 여부를 확인할 수 있습니다.</span><dl><div><dt>온라인 취소</dt><dd>이용 ${state.settings.cancellationCutoffHours}시간 전까지</dd></div><div><dt>이후 변경</dt><dd>${h(state.settings.phone)}로 문의</dd></div></dl>',
              '<span>예약할 때 사용한 이름과 휴대폰 번호만 입력하면 예약 상태, 오픈룸 현황과 취소 가능 여부를 확인할 수 있습니다.</span><dl><div><dt>온라인 취소</dt><dd>이용 ${state.settings.cancellationCutoffHours}시간 전까지</dd></div><div><dt>당일 취소</dt><dd>고객 사유 환불 불가</dd></div><div><dt>이후 변경</dt><dd>${h(state.settings.phone)}로 문의</dd></div></dl>',
              'lookup cancellation summary',
          )

          js = replace_once(
              js,
              'confirm(`예약을 취소하시겠습니까?\\n이용 ${state.settings.cancellationCutoffHours}시간 전부터는 온라인 취소가 제한됩니다.`)',
              'confirm(`예약을 취소하시겠습니까?\\n이용 ${state.settings.cancellationCutoffHours}시간 전부터는 온라인 취소가 제한됩니다.\\n이용 당일 고객 사유 취소는 환불되지 않습니다.`)',
              'cancel confirmation',
          )

          js = replace_once(
              js,
              '단순히 자물쇠를 푸는 방식이 아니라, 각자 맡은 배역으로 현장을 조사하고 증거를 모은 뒤 서로 대화하며 범인을 찾습니다.',
              '탈출이 목표가 아닙니다. 각자 맡은 배역으로 현장을 조사하고 증거를 모은 뒤 서로의 진술을 검증해 용의자 중 범인을 찾습니다.',
              'guide definition',
          )

          js = replace_once(
              js,
              '<li><strong>취소</strong><span>이용 ${state.settings.cancellationCutoffHours}시간 전까지 온라인 취소가 가능하며 이후에는 매장으로 문의해 주세요.</span></li>',
              '<li><strong>취소</strong><span>이용 ${state.settings.cancellationCutoffHours}시간 전까지 온라인 취소가 가능합니다. 이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다.</span></li>',
              'guide cancellation note',
          )

          js = replace_once(
              js,
              'const faqs=[\n      ["몇 명부터 게임을 진행할 수 있나요?"',
              'const faqs=[\n      ["어떤 게임인가요?","각자 사건 속 인물을 맡아 현장을 조사하고, 단서와 진술을 바탕으로 용의자 중 진범을 찾는 크라임씬 추리게임입니다. 탈출이 목표인 게임이 아닙니다."],\n      ["당일에 예약을 취소하면 환불되나요?","이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다. 예약 전 날짜, 시간과 인원을 반드시 확인해 주세요."],\n      ["몇 명부터 게임을 진행할 수 있나요?"',
              'faq additions',
          )

          js = replace_once(
              js,
              '["예약을 취소하려면 어떻게 하나요?",`예약 확인·취소 화면에서 이용 ${state.settings.cancellationCutoffHours}시간 전까지 취소할 수 있습니다. 이후에는 매장으로 문의해 주세요.`],',
              '["예약을 취소하려면 어떻게 하나요?",`예약 확인·취소 화면에서 이용 ${state.settings.cancellationCutoffHours}시간 전까지 취소할 수 있습니다. 이후에는 매장으로 문의해야 하며, 이용 당일 고객 사유 취소는 환불되지 않습니다.`],',
              'faq cancellation answer',
          )

          js = replace_once(
              js,
              '["1. 목적",`${s.storeName}(이하 “매장”)이 제공하는 예약 및 체험 서비스의 이용 조건과 이용자와 매장 사이의 권리·의무를 정합니다.`],',
              '["1. 목적",`${s.storeName}(이하 “매장”)이 제공하는 크라임씬 추리게임 예약 및 체험 서비스의 이용 조건과 이용자와 매장 사이의 권리·의무를 정합니다. 이용자는 사건 속 인물이 되어 현장을 조사하고 단서와 진술로 용의자 중 범인을 찾습니다.`],',
              'terms service definition',
          )

          js = replace_once(
              js,
              '["5. 콘텐츠 보호","사건의 정답, 핵심 단서와 진행 내용을 외부에 공개해 다른 이용자의 체험을 방해해서는 안 됩니다."],\n        ["6. 서비스 변경","시설 점검, 안전 또는 불가피한 운영 사유가 발생하면 매장은 일정을 변경하거나 예약을 취소할 수 있으며, 유료 결제가 완료된 경우 해당 금액을 환급합니다."],\n        ["7. 문의",`${s.phone} / ${s.email}`],',
              '["5. 취소와 환불",`이용 ${s.cancellationCutoffHours}시간 전까지 온라인 취소가 가능합니다. 이용 당일 고객 사유 취소와 무단 불참은 환불되지 않으며, 매장 사정 또는 관계 법령상 환불 사유가 있는 경우에는 해당 기준을 우선 적용합니다.`],\n        ["6. 콘텐츠 보호","사건의 정답, 핵심 단서와 진행 내용을 외부에 공개해 다른 이용자의 체험을 방해해서는 안 됩니다."],\n        ["7. 서비스 변경","시설 점검, 안전 또는 불가피한 운영 사유가 발생하면 매장은 일정을 변경하거나 예약을 취소할 수 있으며, 유료 결제가 완료된 경우 해당 금액을 환급합니다."],\n        ["8. 문의",`${s.phone} / ${s.email}`],',
              'terms cancellation section',
          )

          old_refunds = '''refunds:{title:"예약 취소 안내",desc:"예약 변경과 취소에 적용되는 기준입니다.",sections:[
        ["1. 온라인 취소",`이용 시작 ${s.cancellationCutoffHours}시간 전까지 예약 확인·취소 화면에서 직접 취소할 수 있습니다.`],
        ["2. 취소 가능 시간이 지난 경우",`이용 시작 ${s.cancellationCutoffHours}시간 전부터는 온라인 취소가 제한됩니다. ${s.phone}로 문의해 주세요. 결제 완료 예약의 환급 여부와 금액은 예약 시 표시된 기준과 관계 법령에 따릅니다.`],
        ["3. 예약 변경","사건, 날짜, 시간 또는 인원 변경이 필요한 경우 매장으로 문의해 주세요. 변경할 회차의 잔여 인원에 따라 변경이 어려울 수 있습니다."],
        ["4. 지각과 미방문","지각하면 전체 이용 시간이 줄어들 수 있으며 시작 후 입장이 제한될 수 있습니다. 연락 없이 방문하지 않은 경우 환급이 제한될 수 있습니다."],
        ["5. 매장 사유 취소","시설 또는 운영상의 사유로 예약한 서비스를 제공하지 못하는 경우 일정 변경 또는 결제 금액 전액 환급을 안내합니다."],
        ["6. 문의",`${s.phone} / ${s.email}`],
      ]},'''
          new_refunds = '''refunds:{title:"취소 및 환불 안내",desc:"예약 전 반드시 확인해야 하는 취소 및 환불 기준입니다.",sections:[
        ["1. 온라인 취소",`이용 시작 ${s.cancellationCutoffHours}시간 전까지 예약 확인·취소 화면에서 직접 취소할 수 있습니다.`],
        ["2. 이용 당일 취소","이용 당일 고객 사유로 예약을 취소하거나 연락 없이 방문하지 않은 경우에는 환불되지 않습니다. 예약 전 날짜, 시작 시간과 인원을 반드시 확인해 주세요."],
        ["3. 취소 가능 시간이 지난 경우",`이용 시작 ${s.cancellationCutoffHours}시간 전부터는 온라인 취소가 제한됩니다. 변경이나 취소가 필요한 경우 ${s.phone}로 문의해 주세요.`],
        ["4. 예약 변경","사건, 날짜, 시간 또는 인원 변경이 필요한 경우 매장으로 문의해 주세요. 변경할 회차의 잔여 인원에 따라 변경이 어려울 수 있습니다."],
        ["5. 지각과 미방문","지각하면 전체 이용 시간이 줄어들 수 있으며 시작 후 입장이 제한될 수 있습니다. 이용 당일 무단 불참은 환불되지 않습니다."],
        ["6. 매장 사유 취소","시설 또는 운영상의 사유로 예약한 서비스를 제공하지 못하는 경우 일정 변경 또는 결제 금액 전액 환급을 안내합니다."],
        ["7. 예외 기준","매장 사정 또는 관계 법령상 별도의 환불 사유가 인정되는 경우에는 해당 기준을 우선 적용합니다."],
        ["8. 문의",`${s.phone} / ${s.email}`],
      ]},'''
          js = replace_once(js, old_refunds, new_refunds, 'refund policy')

          marker = '/* CUSTOMER CLARITY NOTICE 2026-08-18 */'
          if marker in css:
              raise SystemExit('clarity CSS already exists')
          css += r'''

/* CUSTOMER CLARITY NOTICE 2026-08-18 */
:root{--customer-clarity-height:52px}
.customer-ui body{padding-top:var(--customer-clarity-height)}
.customer-ui .site-header{top:var(--customer-clarity-height)}
.customer-clarity{position:fixed;z-index:1250;inset:0 0 auto;height:var(--customer-clarity-height);display:flex;align-items:center;background:#f0e9dd;color:#17191d;border-bottom:1px solid rgba(23,25,29,.16)}
.customer-clarity-inner{width:min(1320px,calc(100% - 36px));height:100%;margin:auto;display:flex;align-items:center;justify-content:center;gap:17px;font-size:13px;line-height:1.45;text-align:center}
.customer-clarity strong{flex:0 0 auto;color:#9f302a;font-size:12px;font-weight:900;letter-spacing:.04em}
.customer-clarity span{color:#34373c;font-weight:700}
.customer-clarity a{flex:0 0 auto;padding-bottom:2px;border-bottom:1px solid currentColor;color:#942d28;font-weight:900}
.crime-scene-definition{display:grid;grid-template-columns:1.15fr .85fr;gap:54px;align-items:center;padding:72px max(40px,calc((100vw - 1180px)/2));background:#171a1f;color:#fff}
.crime-scene-definition>div>p{margin:0 0 11px;color:#df8a82;font-size:13px;font-weight:900}
.crime-scene-definition h2{margin:0;font-size:clamp(32px,4vw,54px);line-height:1.14;letter-spacing:-.055em}
.crime-scene-definition>div>span{display:block;max-width:720px;margin-top:20px;color:#c8cbd1;font-size:16px;line-height:1.85}
.crime-scene-definition aside{padding:26px 28px;border-left:4px solid var(--red);background:#24272d}
.crime-scene-definition aside strong{display:block;color:#fff;font-size:17px}
.crime-scene-definition aside p{margin:10px 0 18px;color:#ffd4cf;font-size:15px;font-weight:850;line-height:1.65}
.crime-scene-definition aside a{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:14px;font-weight:850;border-bottom:1px solid rgba(255,255,255,.55)}
.reservation-guide>div{min-width:0}.reservation-guide>div>p{margin:0}.reservation-guide .same-day-refund{margin-top:7px;color:#9b302a;font-weight:900}
.booking-critical-notice{margin:18px 0 20px;padding:20px 22px;border:1px solid rgba(183,70,61,.36);border-left:4px solid var(--red);background:#fff1ee}
.booking-critical-notice strong{display:block;color:#962f29;font-size:15px;font-weight:900}.booking-critical-notice p{margin:8px 0 0;color:#5d514e;font-size:14px;font-weight:700;line-height:1.75}
.complete-refund-notice{margin-top:18px;padding:18px 20px;border-left:4px solid var(--red);background:#fff1ee;text-align:left}.complete-refund-notice strong{display:block;color:#962f29;font-size:15px}.complete-refund-notice p{margin:7px 0 0;color:#5d514e;font-size:14px;line-height:1.7}
@media(max-width:800px){:root{--customer-clarity-height:78px}.customer-clarity-inner{width:calc(100% - 28px);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;justify-content:stretch;padding:8px 0;text-align:left;font-size:11px}.customer-clarity strong{grid-row:1/3;align-self:start;font-size:10px}.customer-clarity a{justify-self:start}.crime-scene-definition{grid-template-columns:1fr;gap:28px;padding:58px 20px}.crime-scene-definition>div>span{font-size:14px}}
@media(max-width:480px){:root{--customer-clarity-height:96px}.customer-clarity-inner{grid-template-columns:1fr;gap:2px}.customer-clarity strong{grid-row:auto}.customer-clarity span{font-size:10.5px}.crime-scene-definition{padding:48px 20px}.crime-scene-definition h2{font-size:34px}.booking-critical-notice,.complete-refund-notice{padding:17px}}
'''

          build = replace_once(
              build,
              '["policies/refunds", "policy:refunds", "예약 취소 안내"],',
              '["policies/refunds", "policy:refunds", "취소 및 환불 안내"],',
              'refund route title',
          )
          build = replace_once(
              build,
              '"크라임씬플레이 서면1호점 역할형 추리게임 예약 사이트";',
              '"사건 속 인물이 되어 단서와 진술로 용의자 중 범인을 찾는 크라임씬플레이 서면1호점 추리게임 예약 사이트";',
              'site description',
          )

          if shell.count('v=20260817-1') != 3:
              raise SystemExit('unexpected cache version count')
          shell = shell.replace('v=20260817-1', 'v=20260818-2')

          smoke_marker = 'if(!app.innerHTML.includes("사건 속 인물이 되어"))throw new Error("홈 화면이 렌더링되지 않았습니다.");'
          smoke_add = smoke_marker + '\n  if(!app.innerHTML.includes("방탈출카페가 아닙니다"))throw new Error("게임 방식 필수 안내가 없습니다.");\n  if(!app.innerHTML.includes("이용 당일 고객 사유 취소는 환불되지 않습니다"))throw new Error("당일 취소 환불 안내가 없습니다.");\n  if((app.innerHTML.match(/방탈출카페/g)||[]).length!==1)throw new Error("방탈출카페 표현이 한 번을 초과합니다.");'
          smoke = replace_once(smoke, smoke_marker, smoke_add, 'smoke assertions')

          build_check = "          grep -q '이용 예정 금액' _site/assets/customer-final.js\n"
          build_extra = build_check + "          grep -q '방탈출카페가 아닙니다' _site/assets/customer-final.js\n          grep -q '이용 당일 고객 사유 취소는 환불되지 않습니다' _site/assets/customer-final.js\n          test \"$(grep -o '방탈출카페' _site/assets/customer-final.js | wc -l | tr -d ' ')\" = '1'\n          grep -q 'CUSTOMER CLARITY NOTICE' _site/assets/final.css\n"
          pages = replace_once(pages, build_check, build_extra, 'pages build verification')

          live_check = "          grep -q '이용 예정 금액' /tmp/customer-final.js\n"
          live_extra = live_check + "          grep -q '방탈출카페가 아닙니다' /tmp/customer-final.js\n          grep -q '이용 당일 고객 사유 취소는 환불되지 않습니다' /tmp/customer-final.js\n          test \"$(grep -o '방탈출카페' /tmp/customer-final.js | wc -l | tr -d ' ')\" = '1'\n          grep -q 'CUSTOMER CLARITY NOTICE' /tmp/final.css\n"
          pages = replace_once(pages, live_check, live_extra, 'pages live verification')

          if js.count('방탈출카페') != 1:
              raise SystemExit(f'방탈출카페 count is {js.count("방탈출카페")}, expected 1')
          required = [
              '방탈출카페가 아닙니다',
              '용의자 중 진짜 범인을 찾는 추리게임입니다',
              '이용 당일 고객 사유 취소는 환불되지 않습니다',
              '이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다',
              'booking-critical-notice',
              'complete-refund-notice',
              '취소 및 환불 안내',
          ]
          for phrase in required:
              if phrase not in js:
                  raise SystemExit(f'missing required phrase: {phrase}')
          if '절때' in js or '절때' in css:
              raise SystemExit('typo 절때 remains')

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          build_path.write_text(build, encoding='utf-8')
          shell_path.write_text(shell, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')
          pages_path.write_text(pages, encoding='utf-8')
          PY

      - name: Build and inspect every generated route
        shell: bash
        run: |
          set -euo pipefail
          node pages-src/build.mjs
          node --check _site/assets/customer-final.js
          node scripts/smoke-customer.cjs
          grep -q '방탈출카페가 아닙니다' _site/assets/customer-final.js
          grep -q '용의자 중 진짜 범인을 찾는 추리게임입니다' _site/assets/customer-final.js
          grep -q '이용 당일 고객 사유 취소는 환불되지 않습니다' _site/assets/customer-final.js
          grep -q '이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다' _site/assets/customer-final.js
          grep -q 'booking-critical-notice' _site/assets/customer-final.js
          grep -q 'complete-refund-notice' _site/assets/customer-final.js
          grep -q 'CUSTOMER CLARITY NOTICE' _site/assets/final.css
          test "$(grep -o '방탈출카페' _site/assets/customer-final.js | wc -l | tr -d ' ')" = '1'
          for file in _site/index.html _site/guide/index.html _site/faq/index.html _site/reservations/index.html _site/reservations/new/index.html _site/reservations/complete/index.html _site/policies/terms/index.html _site/policies/refunds/index.html; do
            test -s "$file"
            grep -q 'customer-final.js?v=20260818-2' "$file"
            grep -q 'final.css?v=20260818-2' "$file"
          done

      - name: Commit the live source changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-customer-clarity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows pages-src scripts/smoke-customer.cjs
          git commit -m 'feat: clarify crime scene format and same-day refund rule'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the customer Pages deployment
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?event=push&per_page=20"
          run_id=''
          for attempt in $(seq 1 60); do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" > /tmp/page-runs.json
            run_id=$(jq -r --arg sha "$DEPLOY_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' /tmp/page-runs.json | head -1)
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          conclusion=''
          for attempt in $(seq 1 120); do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/page-run.json
            status=$(jq -r '.status' /tmp/page-run.json)
            conclusion=$(jq -r '.conclusion // ""' /tmp/page-run.json)
            [ "$status" = 'completed' ] && break
            sleep 5
          done
          test "$conclusion" = 'success'

      - name: Verify the deployed customer site
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          page_url=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" | jq -r '.html_url // empty')
          [ -n "$page_url" ] || page_url='https://sosirusok.github.io/crimescene/'
          base="${page_url%/}/"

          ready=0
          for attempt in $(seq 1 36); do
            if curl -L --retry 2 --retry-all-errors -fsSL "${base}?clarity=${GITHUB_SHA}" -o /tmp/live-home.html; then
              if grep -q 'customer-final.js?v=20260818-2' /tmp/live-home.html; then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = '1'

          script_path=$(grep -oE 'assets/customer-final\.js\?v=[^" ]+' /tmp/live-home.html | head -1)
          style_path=$(grep -oE 'assets/final\.css\?v=[^" ]+' /tmp/live-home.html | head -1)
          test -n "$script_path"
          test -n "$style_path"
          curl -L --retry 5 --retry-all-errors -fsSL "${base}${script_path}" -o /tmp/live-customer.js
          curl -L --retry 5 --retry-all-errors -fsSL "${base}${style_path}" -o /tmp/live-customer.css
          node --check /tmp/live-customer.js
          grep -q '방탈출카페가 아닙니다' /tmp/live-customer.js
          grep -q '용의자 중 진짜 범인을 찾는 추리게임입니다' /tmp/live-customer.js
          grep -q '이용 당일 고객 사유 취소는 환불되지 않습니다' /tmp/live-customer.js
          grep -q '이용 당일 고객 사유 취소와 무단 불참은 환불되지 않습니다' /tmp/live-customer.js
          grep -q 'booking-critical-notice' /tmp/live-customer.js
          grep -q 'complete-refund-notice' /tmp/live-customer.js
          grep -q 'CUSTOMER CLARITY NOTICE' /tmp/live-customer.css
          test "$(grep -o '방탈출카페' /tmp/live-customer.js | wc -l | tr -d ' ')" = '1'
          echo "page_url=$base" >> "$GITHUB_OUTPUT"

      - name: Record the successful live verification
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
          PAGE_RUN_ID: ${{ steps.pages.outputs.run_id }}
          PAGE_URL: ${{ steps.live.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/customer-clarity-verification.md <<EOF
          # 고객 사이트 필수 안내 적용 검증

          - 적용 커밋: ${DEPLOY_SHA}
          - Pages 실행 번호: ${PAGE_RUN_ID}
          - 배포 주소: ${PAGE_URL}
          - 빌드와 배포: 성공
          - 실제 배포 파일 확인: 성공
          - 전체 페이지 상단 게임 방식 안내: 적용
          - 메인 화면 크라임씬 설명: 적용
          - 예약 화면 당일 취소 환불 안내: 적용
          - 예약 동의 문구: 적용
          - 예약 완료 화면 재안내: 적용
          - 이용 안내와 자주 묻는 질문: 적용
          - 이용약관과 취소 및 환불 안내: 적용
          - 방탈출카페 표현: 부정 안내에만 1회 사용
          - 확인 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add docs/customer-clarity-verification.md
          git commit -m 'docs: record customer clarity deployment verification'
          git pull --rebase origin main
          git push origin HEAD:main
