name: Apply custom domain runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-domain-ready.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Switch customer API endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages-src/customer-final.js')
          s=p.read_text(encoding='utf-8')
          old='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/api'
          new='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/customer-api'
          if new not in s:
              if old not in s:
                  raise SystemExit('customer API constant not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check pages-src/customer-final.js
          grep -q 'functions/v1/customer-api' pages-src/customer-final.js
          PAGES_BASE=/crimescene node pages-src/build.mjs
          node scripts/smoke-customer.cjs
      - name: Commit verified runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-src/customer-final.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: support customer custom domain API origin'
          git push origin HEAD:main
