name: Apply owner feedback to customer site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-owner-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-owner-feedback-customer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply owner instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-owner-feedback.py

      - name: Verify customer source and generated site
        shell: bash
        run: |
          set -euo pipefail
          node --check pages-src/customer-final.js
          node pages-src/build.mjs
          node scripts/smoke-customer.cjs

          grep -q '(주)싱글' pages-src/customer-final.js
          grep -q '정지훈' pages-src/customer-final.js
          grep -q '744-88-01446' pages-src/customer-final.js
          grep -q 'jjhun65@hanmail.net' pages-src/customer-final.js
          grep -q 'menu-lines' pages-src/customer-final.js
          grep -q 'document.addEventListener("pointerup"' pages-src/customer-final.js
          grep -q 'ResizeObserver' pages-src/customer-final.js
          grep -q 'aria-controls="mobile-drawer"' pages-src/customer-final.js
          grep -q 'open-room-introductions' pages-src/customer-final.js
          grep -q 'OWNER FEEDBACK FINAL 2026-08-19' pages-src/final.css
          grep -q 'v=20260819-2' pages-src/shell.html

          ! grep -q '난이도</dt>' pages-src/customer-final.js
          ! grep -q 'theme.difficulty' pages-src/customer-final.js
          ! grep -q 'theme.difficulty' app/themes/page.tsx
          ! grep -q 'theme.difficulty' 'app/themes/[slug]/page.tsx'
          ! grep -q 'difficulty:' app/data/themes.ts

          test -s _site/index.html
          test -s _site/reservations/index.html
          test -s _site/reservations/new/index.html
          node --check _site/assets/customer-final.js
          grep -q 'menu-lines' _site/assets/customer-final.js
          grep -q 'open-room-introductions' _site/assets/customer-final.js
          grep -q 'OWNER FEEDBACK FINAL 2026-08-19' _site/assets/final.css

      - name: Commit completed source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pages-src/customer-final.js \
            pages-src/final.css \
            pages-src/shell.html \
            scripts/smoke-customer.cjs \
            app/components/site-footer.tsx \
            app/data/themes.ts \
            app/themes/page.tsx \
            'app/themes/[slug]/page.tsx'

          if git diff --cached --quiet; then
            echo 'Owner feedback source was already up to date.'
            exit 0
          fi

          git commit -m 'fix: complete owner feedback across customer site'
          git pull --rebase origin main
          git push origin HEAD:main
