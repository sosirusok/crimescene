name: Record customer Pages result

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record deployment result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/customer-pages-status.txt <<EOF
          run_id=${RUN_ID}
          run_number=${RUN_NUMBER}
          head_sha=${HEAD_SHA}
          conclusion=${CONCLUSION}
          run_url=${RUN_URL}
          updated_at=${UPDATED_AT}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/customer-pages-status.txt
          git commit -m "ci: record customer Pages ${CONCLUSION} for run ${RUN_NUMBER}" || exit 0
          git push origin HEAD:main
