name: Fix reservation mobile layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reservation-mobile-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove reservation-page horizontal overflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('pages-src/final.css')
          shell_path = Path('pages-src/shell.html')
          css = css_path.read_text(encoding='utf-8')
          shell = shell_path.read_text(encoding='utf-8')

          marker = '/* RESERVATION MOBILE WIDTH FIX 2026-08-19 */'
          if marker not in css:
              css += r'''

/* RESERVATION MOBILE WIDTH FIX 2026-08-19 */
html{max-width:100%;overflow-x:hidden}
body{max-width:100%;overflow-x:clip}
.reservation-shell,.schedule-controls,.schedule-controls>section,.date-row,.theme-filter,.schedule-heading,.schedule,.schedule-theme,.slot-grid{min-width:0;max-width:100%}
.schedule-controls>section{width:100%}
.date-row{width:100%;overflow-x:auto;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch}
.theme-filter{width:100%}
.schedule-theme{width:100%}
@media(max-width:600px){.reservation-shell{overflow-x:clip}.slot-grid{width:100%}.schedule-theme>header{width:100%}}
'''

          shell = shell.replace('v=20260819-2', 'v=20260819-3')
          css_path.write_text(css, encoding='utf-8')
          shell_path.write_text(shell, encoding='utf-8')
          PY

          node pages-src/build.mjs
          node --check _site/assets/customer-final.js
          node scripts/smoke-customer.cjs
          grep -q 'RESERVATION MOBILE WIDTH FIX 2026-08-19' _site/assets/final.css
          grep -q 'v=20260819-3' _site/reservations/index.html

      - name: Commit the production fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-reservation-mobile-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-src/final.css pages-src/shell.html .github/workflows/fix-reservation-mobile-layout.yml
          git commit -m 'fix: prevent reservation page horizontal overflow on mobile'
          git pull --rebase origin main
          git push origin HEAD:main
