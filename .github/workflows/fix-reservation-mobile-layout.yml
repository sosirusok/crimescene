name: Fix reservation mobile layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reservation-mobile-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply and verify the mobile width fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-reservation-mobile-layout.py
          node pages-src/build.mjs
          node --check _site/assets/customer-final.js
          node scripts/smoke-customer.cjs
          grep -q 'RESERVATION MOBILE WIDTH FIX 2026-08-19' _site/assets/final.css
          grep -q 'v=20260819-3' _site/reservations/index.html

      - name: Commit the production fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-reservation-mobile-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-src/final.css pages-src/shell.html .github/workflows/fix-reservation-mobile-layout.yml
          git commit -m 'fix: prevent reservation page horizontal overflow on mobile'
          git pull --rebase origin main
          git push origin HEAD:main
