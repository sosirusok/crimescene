name: Crawl source site

on:
  push:
    paths:
      - 'crawl-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crawl public pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/mirror research/source-index.json
          mkdir -p research/mirror
          python3 - <<'PY'
          import collections, hashlib, json, os, pathlib, re, time
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, urldefrag
          from urllib.request import Request, urlopen

          ROOTS = [
              'http://www.crimesceneplay.com/',
              'http://www.crimesceneplay.com/main.html',
              'http://yunell1206.cafe24.com/',
              'http://yunell1206.cafe24.com/main.html',
          ]
          ALLOWED = {'www.crimesceneplay.com', 'crimesceneplay.com', 'yunell1206.cafe24.com'}
          PAGE_EXT = {'', '.html', '.htm', '.php', '.asp', '.aspx', '.do', '.jsp'}
          STATIC_EXT = {'.css', '.js', '.json', '.txt', '.xml'}
          SKIP_EXT = {'.zip', '.rar', '.7z', '.exe', '.mp4', '.avi', '.mov', '.mp3', '.wav'}
          MAX_PAGES = 350
          MAX_BYTES = 3_000_000
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          out = pathlib.Path('research/mirror')
          q = collections.deque(ROOTS)
          seen = set()
          records = []

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ('href','src','action'):
                      value=d.get(key)
                      if value: self.links.append(value)

          def safe_path(url, ctype):
              p=urlparse(url)
              path=p.path or '/index.html'
              if path.endswith('/'): path += 'index.html'
              if not pathlib.PurePosixPath(path).suffix and 'text/html' in ctype: path += '.html'
              suffix=''
              if p.query:
                  suffix='__q_'+hashlib.sha1(p.query.encode()).hexdigest()[:10]
              rel=(p.netloc + path + suffix).lstrip('/')
              rel=re.sub(r'[^0-9A-Za-z가-힣._/~-]+','_',rel)
              return out/rel

          while q and len(seen) < MAX_PAGES:
              raw=q.popleft()
              url=urldefrag(raw)[0]
              if not url.startswith(('http://','https://')) or url in seen: continue
              p=urlparse(url)
              if p.hostname not in ALLOWED: continue
              ext=pathlib.PurePosixPath(p.path).suffix.lower()
              if ext in SKIP_EXT: continue
              seen.add(url)
              try:
                  req=Request(url, headers={'User-Agent':UA, 'Accept':'text/html,application/xhtml+xml,application/json,text/css,*/*;q=0.3'})
                  with urlopen(req, timeout=25) as r:
                      final=r.geturl(); ctype=(r.headers.get('Content-Type') or '').lower(); status=getattr(r,'status',200)
                      data=r.read(MAX_BYTES+1)
                  if len(data)>MAX_BYTES: data=data[:MAX_BYTES]
                  target=safe_path(url,ctype); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
                  rec={'url':url,'final':final,'status':status,'contentType':ctype,'bytes':len(data),'path':str(target)}
                  records.append(rec)
                  if 'text/html' in ctype or ext in PAGE_EXT:
                      for enc in ('euc-kr','cp949','utf-8'):
                          try: text=data.decode(enc); break
                          except UnicodeDecodeError: continue
                      else: text=data.decode('utf-8','replace')
                      parser=Links(); parser.feed(text)
                      for link in parser.links:
                          nxt=urljoin(final,link.strip())
                          np=urlparse(nxt)
                          ne=pathlib.PurePosixPath(np.path).suffix.lower()
                          if np.hostname in ALLOWED and (ne in PAGE_EXT or ne in STATIC_EXT): q.append(nxt)
              except Exception as exc:
                  records.append({'url':url,'error':repr(exc)})
              time.sleep(.08)
          pathlib.Path('research/source-index.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('captured',len(records),'resources')
          PY
      - name: Commit crawl
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mirror research/source-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: crawl source-site pages'
          git push
